<style>
/* Веб-презентация на весь экран: красные шёлковые волны на тёмно-тёмно-синем перетекают из слайда в слайд,
   текст живёт в рамке 16:9 по центру. Красный — только на главном (правило 60/30/10) */
:root {
  --ink: #03061a;
  --red: #fa0141;
  --red-deep: #7a0a26;
  --blue: #5170ff;
  --sky: #6495ed;
  --fg: #eef0f8;
  --fg2: #c9cee0;
  --muted: #9aa3bf;
  --line: rgba(236, 240, 255, .14);
  --line-strong: rgba(236, 240, 255, .32);
  --glass: rgba(5, 9, 32, .6);
  --glass-line: rgba(238, 240, 248, .11);
  --display: 'Manrope', 'Segoe UI', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --u: min(1vw, 1.7778vh); /* сотая доля ширины кадра 16:9 */
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: var(--display); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(1,2,10,.65) 100%); }

/* кадр 16:9 */
.frame { position: fixed; left: 50%; top: 50%; width: calc(var(--u) * 100); height: calc(var(--u) * 56.25); transform: translate(-50%, -50%); }
.slide { position: absolute; inset: 0; visibility: hidden; transition: visibility 0s .5s; }
.slide.on { visibility: visible; transition: none; }
.pos { position: absolute; }
.in { opacity: 0; transform: translateY(calc(var(--u) * 1.2)); transition: opacity .35s ease, transform .35s ease; }
.slide.on .in { opacity: 1; transform: none; transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--d, 0) * 110ms + 380ms); }

/* типографика */
.eyebrow { margin: 0; font: 500 calc(var(--u) * .95)/1.3 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--red); font-weight: 600; }
.title { margin: 0; font: 800 calc(var(--u) * 8.2)/.95 var(--display); letter-spacing: -.035em; }
h2 { margin: 0; font: 800 calc(var(--u) * 3.7)/1.06 var(--display); letter-spacing: -.025em; text-wrap: balance; }
h3 { margin: 0; font: 700 calc(var(--u) * 1.32)/1.25 var(--display); letter-spacing: -.01em; }
.lead { margin: 0; font: 400 calc(var(--u) * 1.5)/1.45 var(--display); color: var(--fg2); text-wrap: pretty; }
p, li, td, th { font-size: calc(var(--u) * 1.12); line-height: 1.5; }
.mut { color: var(--muted); }
.r { color: var(--red); }
.slide :is(.title, h2, h3, .lead, p) { text-shadow: 0 2px 22px rgba(3, 6, 26, .85); }
.stack { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
.glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: calc(var(--u) * 1.2); backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); }
.chip { display: inline-flex; align-items: center; gap: .6em; padding: .5em 1em; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); font: 500 calc(var(--u) * .95)/1 var(--mono); letter-spacing: .06em; color: var(--fg2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .7); }
.num { font: 600 calc(var(--u) * .95)/1 var(--mono); color: var(--sky); letter-spacing: .08em; }

/* 1, 10 — рамка видоискателя */
.br { position: absolute; width: calc(var(--u) * 4.5); aspect-ratio: 1; border: 0 solid var(--line-strong); }
.br.tl { left: 5%; top: 19%; border-left-width: 3px; border-top-width: 3px; border-top-left-radius: 14px; }
.br.tr { left: calc(53% - var(--u) * 4.5); top: 19%; border-right-width: 3px; border-top-width: 3px; border-top-right-radius: 14px; }
.br.bl { left: 5%; top: calc(80% - var(--u) * 4.5); border-left-width: 3px; border-bottom-width: 3px; border-bottom-left-radius: 14px; }
.br.bR { left: calc(53% - var(--u) * 4.5); top: calc(80% - var(--u) * 4.5); border-right-width: 3px; border-bottom-width: 3px; border-bottom-right-radius: 14px; }
.scanline { position: absolute; left: 6%; width: 46%; height: 2px; top: 20%; background: linear-gradient(90deg, transparent, rgba(255,120,150,.75), transparent); opacity: 0; }
.slide.on .scanline { animation: scan 4.2s 1.4s ease-in-out infinite; }
@keyframes scan { 0% { transform: translateY(0); opacity: 0 } 15%, 85% { opacity: .85 } 100% { transform: translateY(calc(var(--u) * 33)); opacity: 0 } }
.url { pointer-events: auto; color: var(--fg); text-decoration: none; font: 600 calc(var(--u) * 1.5)/1 var(--mono); letter-spacing: .04em; border-bottom: 2px solid var(--red); padding-bottom: .2em; }
.url:focus-visible { outline: 2px solid var(--red); outline-offset: 6px; }

/* 2 — актуальность */
.orbits { position: absolute; left: 68%; top: 50%; width: 0; height: 0; }
.orbits svg { position: absolute; left: calc(var(--u) * -26); top: calc(var(--u) * -26); width: calc(var(--u) * 52); height: calc(var(--u) * 52); overflow: visible; }
.slide.on .spin { animation: spin 40s linear infinite; transform-origin: 50% 50%; transform-box: fill-box; }
@keyframes spin { to { transform: rotate(360deg); } }
.squares { left: 68%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.2); }
.squares .row { display: flex; align-items: flex-end; gap: calc(var(--u) * 3); }
.squares figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .8); }
.sq { background: #0b0c12; border: 2px solid var(--blue); box-shadow: 0 0 calc(var(--u) * 2) rgba(81,112,255,.45); }
.sq.big { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); }
.sq.small { width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
.squares figcaption, .squares p { margin: 0; font: 500 calc(var(--u) * .95)/1.3 var(--mono); color: var(--fg2); letter-spacing: .06em; text-align: center; }
.pains { display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); margin: 0; padding: 0; list-style: none; }
.pains li { display: grid; grid-template-columns: calc(var(--u) * 1.4) 1fr; gap: calc(var(--u) * .9); }
.pains li::before { content: ""; width: calc(var(--u) * .62); height: calc(var(--u) * .62); margin-top: calc(var(--u) * .5); border: 2px solid var(--red); transform: rotate(45deg); }
.pains p { margin: calc(var(--u) * .25) 0 0; color: var(--muted); }

/* 3 — анализ решений */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font: 500 calc(var(--u) * .85)/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: calc(var(--u) * .9) calc(var(--u) * 1); border-bottom: 1px solid var(--line); vertical-align: bottom; }
td { padding: calc(var(--u) * .78) calc(var(--u) * 1); border-bottom: 1px solid rgba(236,240,255,.07); color: var(--fg2); vertical-align: top; }
td:first-child { color: var(--fg); font-weight: 700; }
tr.us td { color: var(--fg); background: linear-gradient(90deg, rgba(250,1,65,.16), rgba(250,1,65,.04)); border-bottom: 0; }
tr.us td:first-child { box-shadow: inset 3px 0 0 var(--red); }
.no { color: var(--muted); }

/* 4 — решение */
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.2); }
.step { padding: calc(var(--u) * 1.5) calc(var(--u) * 1.6); display: flex; flex-direction: column; gap: calc(var(--u) * .6); }
.step p { margin: 0; color: var(--fg2); }

/* 5 — демо */
.demo-list { margin: 0; padding: 0; list-style: none; counter-reset: d; display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
.demo-list li { counter-increment: d; display: grid; grid-template-columns: calc(var(--u) * 2.6) 1fr; align-items: baseline; color: var(--fg2); }
.demo-list li::before { content: counter(d, decimal-leading-zero); font: 600 calc(var(--u) * .95)/1 var(--mono); color: var(--sky); letter-spacing: .08em; }
.spark { position: absolute; width: 14px; height: 14px; }
.spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 2px; transform: translate(-50%, -50%); }
.spark::before { width: 2px; height: 100%; } .spark::after { width: 100%; height: 2px; }
.slide.on .spark { animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { filter: drop-shadow(0 0 2px #ff5a7e); } to { filter: drop-shadow(0 0 10px #ff5a7e); opacity: .55; } }

/* 6 — технология */
.pipe { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * 1.6); }
.node { position: relative; padding: calc(var(--u) * 1.4); display: flex; flex-direction: column; gap: calc(var(--u) * .6); }
.node p { margin: 0; color: var(--fg2); font-size: calc(var(--u) * 1.02); }
.node:not(:last-child)::after { content: ""; position: absolute; right: calc(var(--u) * -1.25); top: calc(var(--u) * 2.1); width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-top: 2px solid var(--sky); border-right: 2px solid var(--sky); transform: rotate(45deg); opacity: .8; }

/* 7 — точность */
.big { left: 29%; top: 51%; transform: translate(-50%, -50%); text-align: center; }
.big .value { font: 800 calc(var(--u) * 7.6)/.9 var(--display); letter-spacing: -.04em; color: var(--fg); text-shadow: 0 0 calc(var(--u) * 3) rgba(250,1,65,.75), 0 2px 22px rgba(3,6,26,.85); }
.big .value span { color: var(--red); }
.big p { margin: calc(var(--u) * .9) 0 0; font: 500 calc(var(--u) * .95)/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg2); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.2); }
.stat { padding: calc(var(--u) * 1.3) calc(var(--u) * 1.5); }
.stat strong { display: block; font: 800 calc(var(--u) * 2.6)/1 var(--display); letter-spacing: -.02em; color: var(--sky); }
.stat p { margin: calc(var(--u) * .5) 0 0; color: var(--fg2); }

/* 8 — стек */
.tech { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.2); }
.tcard { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.5); display: flex; flex-direction: column; gap: calc(var(--u) * .9); }
.tags { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5); }
.tags span { padding: .32em .7em; border-radius: 6px; background: rgba(81,112,255,.14); border: 1px solid rgba(100,149,237,.28); font: 500 calc(var(--u) * .9)/1.2 var(--mono); color: #dfe5ff; }

/* 9 — развитие */
.road { left: 7%; top: 33%; width: 86%; }
.road .rail { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.4); height: 2px; background: linear-gradient(90deg, var(--red), var(--sky) 30%, rgba(100,149,237,.2)); }
.road ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * 1.6); }
.road li { display: flex; flex-direction: column; gap: calc(var(--u) * .7); }
.road .when { font: 500 calc(var(--u) * .85)/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); height: calc(var(--u) * 1.4); }
.road .dot { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; border: 2px solid var(--sky); background: var(--ink); margin: calc(var(--u) * .1) 0 calc(var(--u) * .6); }
.road li:first-child .dot { background: var(--red); border-color: var(--red); box-shadow: 0 0 calc(var(--u) * 1.2) var(--red); }
.road p { margin: 0; color: var(--fg2); font-size: calc(var(--u) * 1.02); }
.note { padding: calc(var(--u) * 1) calc(var(--u) * 1.4); color: var(--fg2); }
.horizon { position: absolute; left: -10%; right: -10%; bottom: -8%; height: 46%; }
.horizon svg { width: 100%; height: 100%; display: block; }

/* интерфейс */
.chrome { position: fixed; z-index: 3; display: flex; align-items: center; gap: 10px; }
.logo { left: max(24px, env(safe-area-inset-left, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 22px); width: 34px; height: 34px; }
.tools { right: max(24px, env(safe-area-inset-right, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 22px); }
.nav { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); gap: 14px; }
.count { font: 500 12px/1 var(--mono); letter-spacing: .12em; color: var(--muted); min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; }
.dots button { width: 20px; height: 4px; padding: 0; border: 0; border-radius: 2px; background: rgba(238,240,248,.22); cursor: pointer; position: relative; overflow: hidden; }
.dots button::after { content: ""; position: absolute; inset: 0; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .8s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 10px var(--red); }
.dots button[aria-current="true"]::after { transform: scaleX(1); }
.ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(238,240,248,.18); background: rgba(3,6,26,.4); color: var(--fg); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: border-color .2s, background .2s; }
.ic:hover, .ic[aria-pressed="true"] { border-color: rgba(250,1,65,.7); background: rgba(250,1,65,.12); }
.ic:focus-visible, .dots button:focus-visible, .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.ic svg { width: 18px; height: 18px; }
.progress { position: fixed; left: 0; bottom: 0; height: 2px; width: 100%; background: linear-gradient(90deg, var(--red-deep), var(--red)); transform-origin: left; transform: scaleX(.1); transition: transform 1.4s cubic-bezier(.65,0,.25,1); z-index: 3; box-shadow: 0 0 12px var(--red); }

/* заметки выступающего и полный текст */
.notes { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); transform: translateX(-50%); width: min(880px, calc(100% - 32px)); max-height: 42vh; overflow: auto; padding: 18px 22px; border-radius: 16px; background: rgba(3,6,26,.9); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); user-select: text; -webkit-user-select: text; }
.notes header { display: flex; justify-content: space-between; gap: 12px; font: 500 12px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.notes header button { all: unset; cursor: pointer; color: var(--sky); font-variant-numeric: tabular-nums; }
.notes p { margin: 0; font-size: 17px; line-height: 1.55; color: var(--fg); }
.script { position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: rgba(3,6,26,.96); user-select: text; -webkit-user-select: text; touch-action: pan-y; }
.script .wrap { max-width: 760px; margin: 0 auto; padding-block: calc(env(safe-area-inset-top, 0px) + 32px) 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.script .bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; background: rgba(3,6,26,.96); border-bottom: 1px solid var(--line); z-index: 1; }
.script h1 { margin: 0; font: 800 26px/1.2 var(--display); letter-spacing: -.02em; }
.script h1 small { display: block; font: 500 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.script section { padding: 22px 0; border-bottom: 1px solid rgba(236,240,255,.07); }
.script h2 { font-size: 20px; margin-bottom: 8px; }
.script h2 .num { font-size: 13px; margin-right: 10px; }
.script .time { font: 500 12px/1 var(--mono); color: var(--muted); margin-left: 8px; letter-spacing: .08em; }
.script p { font-size: 17px; line-height: 1.6; color: var(--fg2); margin: 0 0 10px; }
.script .tip { color: var(--muted); font-size: 15px; }
.script dt { font-weight: 700; color: var(--fg); margin-top: 14px; font-size: 17px; }
.script dd { margin: 4px 0 0; color: var(--fg2); font-size: 16px; line-height: 1.55; }

  notesBtn.onclick = toggleNotes;

  const script = document.getElementById('script'), body = document.getElementById('scriptBody');
  function renderScript() {
    const total = work.speech.reduce((a, x) => a + (+x.s || 0), 0);
    document.getElementById('scriptTotal').textContent = `${work.speech.length} слайдов · около ${Math.round(total / 60)} минут`;
    body.innerHTML = work.speech.map((x, i) => `<section><h2><span class="num">${pad(i + 1)}</span><span data-k="speech.${i}.t">${esc(x.t)}</span><span class="time">≈${esc(x.s)} с</span></h2>${x.p.map((t, j) => `<p data-k="speech.${i}.p.${j}">${esc(t)}</p>`).join('')}${x.tip ? `<p class="tip" data-k="speech.${i}.tip">${esc(x.tip)}</p>` : ''}</section>`).join('')
      + `<section><h2>Вопросы жюри — короткие ответы</h2><dl>${work.qa.map(([q, a], i) => `<dt data-k="qa.${i}.0">${esc(q)}</dt><dd data-k="qa.${i}.1">${esc(a)}</dd>`).join('')}</dl></section>`;
  }
  const plain = () => work.speech.map((x, i) => `${i + 1}. ${x.t} (≈${x.s} с)\n${x.p.join('\n')}${x.tip ? '\n[' + x.tip + ']' : ''}`).join('\n\n')
    + '\n\nВопросы жюри\n' + work.qa.map(([q, a]) => `— ${q}\n${a}`).join('\n');
  let lastFocus = null;
  const openScript = () => { lastFocus = document.activeElement; script.hidden = false; document.getElementById('closeBtn').focus(); };
  const closeScript = () => { script.hidden = true; lastFocus?.focus?.(); };
  document.getElementById('scriptBtn').onclick = openScript;
  document.getElementById('closeBtn').onclick = closeScript;
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.onclick = () => {
    const done = () => { copyBtn.textContent = 'Скопировано'; setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = 'Выделено — нажмите ⌘C / Ctrl+C'; };
    try { navigator.clipboard.writeText(plain()).then(done, fallback); } catch (_) { fallback(); }
  };

  // ——— режим правки
  const editBtn = document.getElementById('editBtn'), editbar = document.getElementById('editbar'), editMsg = document.getElementById('editMsg');
  const saveBtn = document.getElementById('saveBtn'), cancelBtn = document.getElementById('cancelBtn');
  const copyEditsBtn = document.getElementById('copyEditsBtn'), doneBtn = document.getElementById('doneBtn');
  const artP = window.claude?.use ? window.claude.use('artifact').catch(() => null) : Promise.resolve(null);
  const userP = window.claude?.use ? window.claude.use('user').catch(() => null) : Promise.resolve(null);
  const DRAFT = 'merakadr-draft';
  let editing = false, dirty = false, draftTimer = 0;
  const say = (t) => { editMsg.textContent = t; };
  function applyEditable() {
    document.querySelectorAll('[data-k]').forEach((el) => {
      if (!editing) { el.removeAttribute('contenteditable'); return; }
      try { el.contentEditable = 'plaintext-only'; } catch (_) { el.contentEditable = 'true'; }
      if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
      el.spellcheck = true;
    });
  }
  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    editBtn.setAttribute('aria-pressed', String(on));
    editbar.hidden = !on;
    if (on) say(dirty ? 'Есть несохранённые правки' : 'Нажмите на любой текст, чтобы изменить');
    applyEditable();
  }
  function markDirty(v) {
    dirty = v; saveBtn.disabled = !v;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => { try { v ? sessionStorage.setItem(DRAFT, JSON.stringify(work)) : sessionStorage.removeItem(DRAFT); } catch (_) {} }, 400);
  }
  const renderAll = () => { renderSlides(); renderScript(); renderNotes(); applyEditable(); };
  editBtn.onclick = () => setEditing(!editing);
  doneBtn.onclick = () => setEditing(false);
  cancelBtn.onclick = () => { work = deep(saved); markDirty(false); renderAll(); say('Правки отменены'); };
  copyEditsBtn.onclick = () => {
    try { navigator.clipboard.writeText(JSON.stringify(work, null, 1)).then(() => say('Правки скопированы — пришлите их в чат'), () => say('Не удалось скопировать')); } catch (_) { say('Не удалось скопировать'); }
  };
  document.addEventListener('input', (e) => {
    const el = e.target.closest?.('[data-k]');
    if (!editing || !el) return;
    set(work, el.dataset.k, el.innerText.replace(/\s*\n\s*/g, ' ').trim());
    markDirty(true); say('Есть несохранённые правки');
    if (!notes.hidden) renderNotes();
  });
  document.addEventListener('paste', (e) => {
    const el = e.target.closest?.('[data-k]');
    if (!editing || !el || el.contentEditable === 'plaintext-only') return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData?.getData('text/plain') || '').replace(/\s+/g, ' '));
  });
  document.addEventListener('click', (e) => { if (editing && e.target.closest?.('a.url, a.qr')) e.preventDefault(); });
  addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  function readOnly(text) { setEditing(false); editBtn.hidden = true; editbar.hidden = true; if (text) { editbar.hidden = false; say(text); setTimeout(() => { editbar.hidden = true; }, 5000); } }
  saveBtn.onclick = async () => {
    if (!dirty) return;
    saveBtn.disabled = true; say('Сохраняю…');
    try { sessionStorage.setItem(DRAFT, JSON.stringify(work)); } catch (_) {}
    const art = await artP;
    if (!art) { say('Сохранение здесь недоступно. Скопируйте правки и пришлите их в чат'); copyEditsBtn.hidden = false; saveBtn.disabled = false; return; }
    try {
      await art.publish({ 'content.json': { content: JSON.stringify(work, null, 1), contentType: 'application/json' } });
      saved = deep(work); markDirty(false); say('Сохранено');
    } catch (err) {
      const c = err && err.code;
      if (c === 'conflict') say('Кто-то сохранил раньше — страница обновится, ваши правки восстановятся');
      else if (['not_writer', 'not_granted', 'consent_required', 'not_declared'].includes(c)) readOnly('Править может только владелец презентации');
      else if (['capability_disabled', 'capability_removed'].includes(c)) { say('Сохранение в этом окне недоступно. Скопируйте правки и пришлите их в чат'); copyEditsBtn.hidden = false; }
      else if (c === 'rate_limited') say('Слишком часто — подождите минуту и сохраните снова');
      else if (c === 'too_large') say('Слишком много текста для сохранения');
      else say('Не получилось сохранить — попробуйте ещё раз');
      saveBtn.disabled = !dirty;
    }
  };
  // кнопку правки показываем тем, кто может сохранять
  Promise.all([artP, userP]).then(async ([art, user]) => {
    if (!art) return;
    const can = user && user.canEdit ? await user.canEdit().catch(() => true) : true;
    if (can) editBtn.hidden = false;
  });

  // ——— клавиатура, колесо, свайпы
  addEventListener('keydown', (e) => {
    if (e.target.isContentEditable) {
      if (e.key === 'Escape') e.target.blur();
      else if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      return;
    }
    if (!script.hidden) { if (e.key === 'Escape') closeScript(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key) && !e.target.closest?.('button, a')) { e.preventDefault(); next(); }
    else if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(COUNT - 1);
    else if ('nNтТ'.includes(e.key)) toggleNotes();
    else if ('tTеЕ'.includes(e.key)) openScript();
    else if ('fFаА'.includes(e.key)) toggleFs();
    else if ('eEуУ'.includes(e.key) && !editBtn.hidden) setEditing(!editing);
  });
  const narrow = () => matchMedia('(max-aspect-ratio: 1/1)').matches;
  addEventListener('wheel', (e) => {
    if (editing || !script.hidden || narrow() || e.target.closest?.('.notes') || performance.now() < busyUntil || Math.abs(e.deltaY) < 12) return;
    e.deltaY > 0 ? next() : prev();
  }, { passive: true });
  let tx = 0, ty = 0;
  addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', (e) => {
    if (!script.hidden || editing) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) dx < 0 ? next() : prev();
  }, { passive: true });
  addEventListener('pointermove', (e) => { mx = e.clientX / W * 2 - 1; my = e.clientY / H * 2 - 1; });
  addEventListener('resize', resize);

  // ——— старт: сразу тексты по умолчанию, затем сохранённые правки из content.json
  resize();
  const start = /^#s(\d{1,2})$/.exec(location.hash);
  const first = start ? Math.min(COUNT, Math.max(1, +start[1])) - 1 : 0;
  shown = clone(TARGETS[first]); from = clone(TARGETS[first]); to = TARGETS[first];
  cur = first; t0 = 0;
  renderAll();
  go(first);
  requestAnimationFrame(frame);
  const valid = (j) => j && Array.isArray(j.slides) && j.slides.length === TPL.length && Array.isArray(j.speech) && Array.isArray(j.qa);
  fetch('content.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((j) => {
    if (valid(j) && JSON.stringify(j) !== JSON.stringify(saved)) { saved = deep(j); work = deep(j); renderAll(); }
    let draft = null;
    try { draft = JSON.parse(sessionStorage.getItem(DRAFT) || 'null'); } catch (_) {}
    if (valid(draft) && JSON.stringify(draft) !== JSON.stringify(saved)) {
      work = draft; renderAll(); markDirty(true);
      artP.then((art) => { if (art) { editBtn.hidden = false; setEditing(true); say('Восстановлены несохранённые правки — проверьте и сохраните'); } });
    }
  });
})();
</script>
